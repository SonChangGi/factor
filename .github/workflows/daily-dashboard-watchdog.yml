name: Daily Factor Dashboard Watchdog

on:
  workflow_dispatch:
    # Manual dispatch remains available when a reviewed refresh is needed.
  schedule:
    # 10:47/14:17 KST Tue-Sat: bounded, staggered freshness-gated retries.
    - cron: "47 1 * * 2-6"
    - cron: "17 5 * * 2-6"

concurrency:
  group: daily-factor-dashboard-watchdog-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  VECLIB_MAXIMUM_THREADS: 1
  NUMEXPR_NUM_THREADS: 1

jobs:
  dispatch-if-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Refresh checkout to latest branch head
        run: |
          git fetch origin "${DEFAULT_BRANCH:-main}" --depth=1
          git reset --hard "origin/${DEFAULT_BRANCH:-main}"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install integrated trading-session freshness checker
        run: |
          python -m pip install uv==0.11.17
          uv sync --frozen --python "$(command -v python)"
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"

      - name: Decide whether dashboard is stale
        id: freshness
        env:
          DASHBOARD_FRESHNESS_EVENT_NAME: schedule
        run: |
          python -m factor_lab.integrated_automation freshness \
            --event-name "${DASHBOARD_FRESHNESS_EVENT_NAME}" \
            --site site >> "$GITHUB_OUTPUT"

      - name: Dispatch daily dashboard workflow
        if: steps.freshness.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          active="$(gh run list --repo "${GITHUB_REPOSITORY}" \
            --workflow daily-dashboard.yml --branch "${DEFAULT_BRANCH:-main}" \
            --limit 100 --json status --jq '[.[] | select(.status != "completed")] | length')"
          if [[ "$active" != 0 ]]; then
            echo "A daily refresh is queued or running; preserving its attempt without dispatching a duplicate."
            exit 0
          fi
          echo "Dashboard is stale: ${{ steps.freshness.outputs.reason }}"
          echo "Latest data: ${{ steps.freshness.outputs.latest_data_as_of }}"
          echo "Target session: ${{ steps.freshness.outputs.target_data_as_of }}"
          gh workflow run daily-dashboard.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${DEFAULT_BRANCH:-main}" \
            -f watchdog_origin=true

      - name: Recover publication when repository data is already fresh
        if: steps.freshness.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PAGE_URL: https://sonchanggi.github.io/factor/
          PUBLICATION_ROOT: public
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          readonly source_sha
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ "${PUBLICATION_ROOT:-docs}" == public ]]; then
            python scripts/build_integrated_publication.py --output public
          fi
          public_files=()
          while IFS= read -r -d '' local_path; do
            public_files+=("${local_path}")
          done < <(find "${PUBLICATION_ROOT:-docs}" -type f -print0 | sort -z)
          (( ${#public_files[@]} > 0 )) || { echo "No public files to verify." >&2; exit 1; }
          readback_dir="$(mktemp -d)"
          trap 'rm -rf "$readback_dir"' EXIT
          readback_attempt=0
          publication_matches() {
            readback_attempt=$((readback_attempt + 1))
            local deadline=$((SECONDS + 300)) local_path relative remote_path remaining request_timeout
            for local_path in "${public_files[@]}"; do
              relative="${local_path#${PUBLICATION_ROOT:-docs}/}"
              [[ "${relative}" =~ ^[A-Za-z0-9._/-]+$ ]] || return 1
              remaining=$((deadline - SECONDS))
              (( remaining > 0 )) || return 1
              request_timeout=$((remaining < 60 ? remaining : 60))
              remote_path="${readback_dir}/${relative//\//_}"
              if ! curl --fail --silent --show-error --location \
                --header "Cache-Control: no-cache" \
                --connect-timeout 10 --max-time "${request_timeout}" \
                "${PAGE_URL%/}/${relative}?__momentum_watchdog=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${readback_attempt}" \
                --output "${remote_path}"; then
                return 1
              fi
              cmp -s "${local_path}" "${remote_path}" || return 1
            done
          }
          if publication_matches; then
            echo "Fresh repository and public Pages match byte-for-byte (${source_sha})."
            exit 0
          fi
          timeout 60s git fetch origin "${DEFAULT_BRANCH:-main}" --depth=1
          if [[ "$(git rev-parse "origin/${DEFAULT_BRANCH:-main}")" != "${source_sha}" ]]; then
            echo "Production advanced during public verification; refusing an older publication request." >&2
            exit 1
          fi
          echo "Repository data is fresh but public Pages differs; requesting deployment only."
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          timeout 30s gh workflow run deploy-pages.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${DEFAULT_BRANCH:-main}" \
            -f expected_source_sha="${source_sha}" \
            -f request_origin=daily-dashboard-watchdog
          deployment_run=""
          for attempt in {1..12}; do
            deployment_run="$(timeout 30s gh run list --repo "${GITHUB_REPOSITORY}" \
              --workflow deploy-pages.yml --event workflow_dispatch --commit "${source_sha}" \
              --limit 10 --json databaseId,createdAt \
              --jq ".[] | select(.createdAt >= \"${dispatched_at}\") | .databaseId" | head -n 1)"
            [[ -n "${deployment_run}" ]] && break
            sleep 5
          done
          [[ -n "${deployment_run}" ]] || { echo "Recovery Pages run was not found." >&2; exit 1; }
          timeout 2100s gh run watch "${deployment_run}" --repo "${GITHUB_REPOSITORY}" \
            --interval 10 --exit-status
          publication_matches || {
            echo "::error::Recovery Pages run completed but public files still differ from ${source_sha}."
            exit 1
          }
          echo "Recovered and verified public Pages without recollecting market data."

  public-site-health:
    needs: dispatch-if-stale
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check public page availability separately from dispatch success
        env:
          PAGE_URL: https://sonchanggi.github.io/factor/
        shell: bash
        run: |
          set -u
          required_paths=(index.html publication.json data/integrated-result.json)
          for attempt in {1..12}; do
            usable=true
            for relative_path in "${required_paths[@]}"; do
              readback="$RUNNER_TEMP/momentum-watchdog-health-${relative_path//\//-}"
              if ! curl --fail --silent --show-error --location \
                --header "Cache-Control: no-cache" \
                --connect-timeout 10 \
                --max-time 120 \
                --output "$readback" \
                "${PAGE_URL%/}/${relative_path}?health=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"; then
                usable=false
                break
              fi
              if [[ ! -s "$readback" ]]; then
                usable=false
                break
              fi
              if [[ "$relative_path" == "index.html" ]] && ! grep -Eiq '<!doctype html|<html' "$readback"; then
                usable=false
                break
              fi
              if [[ "$relative_path" == *.json ]] && ! jq -e 'type == "object" and length > 0' "$readback" >/dev/null; then
                usable=false
                break
              fi
            done
            if [[ "$usable" == "true" ]]; then
              echo "Public page is reachable. Watchdog dispatch success is reported separately."
              exit 0
            fi
            [[ $attempt -lt 12 ]] && sleep 10
          done
          echo "::error::The public Momentum page or its required JSON is unavailable or invalid."
          exit 1
