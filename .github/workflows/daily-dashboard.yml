name: Daily Factor Dashboard

on:
  workflow_dispatch:
    inputs:
      watchdog_origin:
        description: Apply completed-session freshness gating to this retry
        required: true
        default: false
        type: boolean
      reuse_input_cache_key:
        description: Exact failed-run input cache key; leave empty for normal collection
        required: false
        default: ''
        type: string
      archived_input_cache_key:
        description: Initial verified raw vintage cache; normally resolved from last-good data
        required: false
        default: ''
        type: string
      diagnostics_only:
        description: Read restored inputs only; never collect, calculate, commit or deploy
        required: false
        default: false
        type: boolean
      diagnostic_symbols:
        description: Canonical symbols for read-only input inspection (comma separated, maximum 30)
        required: false
        default: ''
        type: string
      diagnostic_start:
        description: First inspection date (ISO)
        required: false
        default: '2015-01-01'
        type: string
      diagnostic_end:
        description: Last inspection date (ISO)
        required: false
        default: '2016-12-15'
        type: string
  schedule:
    # 07:17 KST Tue-Sat, following completed U.S. weekday sessions.
    - cron: "17 22 * * 1-5"

concurrency:
  group: daily-factor-dashboard-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  VECLIB_MAXIMUM_THREADS: 1
  NUMEXPR_NUM_THREADS: 1

jobs:
  admission:
    if: github.ref_name == github.event.repository.default_branch && inputs.diagnostics_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Wait for earlier data pipelines
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/automation_admission.py --max-wait-seconds 2700

  update-dashboard:
    needs: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
      actions: read
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
      should_deploy: ${{ steps.publish.outputs.should_deploy }}
      refresh_skipped: ${{ steps.freshness.outputs.skip }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Bind current production source
        id: source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "${DEFAULT_BRANCH}" --depth=1
          git reset --hard "origin/${DEFAULT_BRANCH}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
          cache: pip
      - name: Install locked live-data runtime
        run: |
          python -m pip install uv==0.11.17
          uv sync --frozen --extra live --extra dev --python "$(command -v python)"
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
      - name: Recheck admission on a failed-job retry
        if: github.run_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/automation_admission.py --max-wait-seconds 300
      - name: Check integrated completed-session freshness
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
          WATCHDOG_ORIGIN: ${{ inputs.watchdog_origin || false }}
        run: |
          set -euo pipefail
          event="${EVENT_NAME}"
          [[ "${WATCHDOG_ORIGIN}" != true ]] || event=schedule
          python -m factor_lab.integrated_automation freshness \
            --site site --event-name "${event}" >> "$GITHUB_OUTPUT"
      - name: Check daily release compatibility before collection
        if: steps.freshness.outputs.skip != 'true'
        run: |
          python scripts/release_preflight.py --mode daily
          python -m pytest -q tests/test_integrated_automation.py::test_fresh_spy_does_not_hide_widespread_stale_equities

      - name: Resolve the explicitly requested immutable input cache
        id: reuse
        if: steps.freshness.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ inputs.reuse_input_cache_key }}
        run: |
          set -euo pipefail
          if [[ -z "${CACHE_KEY}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "${CACHE_KEY}" =~ ^factor-input-v1-([0-9]+)-([0-9]+)$ ]] || { echo "Invalid exact input cache key." >&2; exit 1; }
          run_id="${BASH_REMATCH[1]}"
          attempt="${BASH_REMATCH[2]}"
          cache_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=${CACHE_KEY}" --jq ".actions_caches[] | select(.key == \"${CACHE_KEY}\") | .id" | head -n 1)"
          [[ "${cache_id}" =~ ^[0-9]+$ ]] || { echo "Requested bounded input cache is unavailable." >&2; exit 1; }
          source_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .head_sha)"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "path=outputs/factor-daily/${run_id}-${attempt}" >> "$GITHUB_OUTPUT"
          echo "cache_id=${cache_id}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
      - name: Restore the exact input cache without collection
        id: restore-inputs
        if: steps.reuse.outputs.enabled == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          key: ${{ inputs.reuse_input_cache_key }}
          fail-on-cache-miss: true
          path: |
            ${{ steps.reuse.outputs.path }}/raw
            ${{ steps.reuse.outputs.path }}/market
      - name: Resolve the previous verified primary input vintage
        id: archive
        if: steps.freshness.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_ARCHIVE_KEY: ${{ inputs.archived_input_cache_key }}
        run: |
          set -euo pipefail
          cache_key="${REQUESTED_ARCHIVE_KEY}"
          if [[ -z "${cache_key}" ]]; then
            cache_key="$(python -c 'import json; print(json.load(open("site/data/integrated-result.json"))["data"].get("inputCache", {}).get("key", ""))')"
          fi
          if [[ -z "${cache_key}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "${cache_key}" =~ ^factor-input-v1-([0-9]+)-([0-9]+)$ ]] || { echo "Invalid archived input cache key." >&2; exit 1; }
          run_id="${BASH_REMATCH[1]}"
          attempt="${BASH_REMATCH[2]}"
          cache_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=${cache_key}" --jq ".actions_caches[] | select(.key == \"${cache_key}\") | .id" | head -n 1)"
          [[ "${cache_id}" =~ ^[0-9]+$ ]] || { echo "Last-good raw vintage was evicted; explicit recovery is required." >&2; exit 1; }
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "key=${cache_key}" >> "$GITHUB_OUTPUT"
          echo "path=outputs/factor-daily/${run_id}-${attempt}" >> "$GITHUB_OUTPUT"
      - name: Restore previous primary input vintage for guarded history preservation
        if: steps.archive.outputs.enabled == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          key: ${{ steps.archive.outputs.key }}
          fail-on-cache-miss: true
          path: |
            ${{ steps.archive.outputs.path }}/raw
            ${{ steps.archive.outputs.path }}/market
      - name: Collect, reconcile, calculate and validate the candidate
        id: calculate
        if: steps.freshness.outputs.skip != 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          FACTOR_INPUT_CACHE_KEY: factor-input-v1-${{ github.run_id }}-${{ github.run_attempt }}
          REUSE_ROOT: ${{ steps.reuse.outputs.path }}
          ARCHIVE_ROOT: ${{ steps.archive.outputs.path }}
          FACTOR_ARCHIVED_INPUT_CACHE_KEY: ${{ steps.archive.outputs.key }}
          FACTOR_REUSED_INPUT_CACHE_KEY: ${{ inputs.reuse_input_cache_key }}
        run: |
          set -euo pipefail
          reuse_args=()
          [[ -z "${REUSE_ROOT}" ]] || reuse_args+=(--reuse-input-root "${REUSE_ROOT}")
          [[ -z "${ARCHIVE_ROOT}" ]] || reuse_args+=(--archived-input-root "${ARCHIVE_ROOT}")
          python -m factor_lab.integrated_automation run \
            --workspace "outputs/factor-daily/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --baseline site --candidate outputs/factor-candidate --source-commit "${SOURCE_SHA}" "${reuse_args[@]}"
      - name: Preserve immutable free-market inputs in bounded cache
        id: input-cache
        if: always() && steps.calculate.outcome != 'skipped'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          key: factor-input-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/factor-daily/${{ github.run_id }}-${{ github.run_attempt }}/raw
            outputs/factor-daily/${{ github.run_id }}-${{ github.run_attempt }}/market
      - name: Verify the saved input cache before promotion
        if: success() && steps.calculate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: factor-input-v1-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cache_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=${CACHE_KEY}" --jq ".actions_caches[] | select(.key == \"${CACHE_KEY}\") | .id" | head -n 1)"
          [[ "${cache_id}" =~ ^[0-9]+$ ]] || { echo "Input cache was not saved; preserving last-good publication." >&2; exit 1; }
          python -m factor_lab.integrated_automation confirm-input-cache \
            --workspace "outputs/factor-daily/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --cache-key "${CACHE_KEY}" --cache-id "${cache_id}"
      - name: Promote and commit only the validated Factor publication
        id: publish
        if: steps.freshness.outputs.skip != 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "${DEFAULT_BRANCH}" --depth=1
          [[ "$(git rev-parse "origin/${DEFAULT_BRANCH}")" == "${SOURCE_SHA}" ]] || {
            echo "Source advanced during calculation; preserving candidate without publication." >&2
            exit 1
          }
          python -m factor_lab.integrated_automation promote \
            --workspace "outputs/factor-daily/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --baseline site --candidate outputs/factor-candidate
          python scripts/validate_integrated_publication.py site
          python -m factor_lab.publication_security site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site
          git commit -m "Update validated Factor results for ${{ steps.freshness.outputs.target_data_as_of }}"
          # No force push or rebase of a calculated artifact onto another source.
          git push origin "HEAD:${DEFAULT_BRANCH}"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
      - name: Record refresh result
        if: always()
        run: |
          status="outputs/factor-daily/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/status.json"
          if [[ -f "${status}" ]]; then
            jq '{state,targetDataAsOf,dataAsOf,resultId,lastGoodPreserved,errorType,reason}' "${status}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Refresh skipped: ${{ steps.freshness.outputs.skip }}; target close: ${{ steps.freshness.outputs.target_data_as_of }}" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.freshness.outputs.skip != 'true'
        with:
          name: factor-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            outputs/factor-daily/*/status.json
            outputs/factor-daily/*/history-revision.json
            outputs/factor-daily/*/raw/history-coverage-failure.json
            outputs/factor-daily/*/raw/manifest.json
            outputs/factor-daily/*/market/manifest.json
            outputs/factor-daily/*/analysis/result.json
            outputs/factor-candidate/publication.json

  request-pages-deployment:
    needs: update-dashboard
    if: needs.update-dashboard.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch and verify exact-source Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.update-dashboard.outputs.source_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          timeout 30s gh workflow run deploy-pages.yml --repo "${GITHUB_REPOSITORY}" \
            --ref "${DEFAULT_BRANCH}" -f expected_source_sha="${SOURCE_SHA}" -f request_origin=daily-dashboard
          deployment_run=""
          for attempt in {1..12}; do
            deployment_run="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow deploy-pages.yml \
              --event workflow_dispatch --commit "${SOURCE_SHA}" --limit 10 --json databaseId,createdAt \
              --jq ".[] | select(.createdAt >= \"${dispatched_at}\") | .databaseId" | head -n 1)"
            [[ -n "${deployment_run}" ]] && break
            sleep 5
          done
          [[ -n "${deployment_run}" ]] || { echo "Exact-source Pages run not found." >&2; exit 1; }
          timeout 2100s gh run watch "${deployment_run}" --repo "${GITHUB_REPOSITORY}" --interval 10 --exit-status

  refresh-result:
    needs: [update-dashboard, request-pages-deployment]
    if: always() && inputs.diagnostics_only != true
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validated refresh and exact-source deployment
        env:
          UPDATE_RESULT: ${{ needs.update-dashboard.result }}
          REFRESH_SKIPPED: ${{ needs.update-dashboard.outputs.refresh_skipped }}
          SHOULD_DEPLOY: ${{ needs.update-dashboard.outputs.should_deploy }}
          DEPLOY_RESULT: ${{ needs.request-pages-deployment.result }}
        run: |
          set -euo pipefail
          [[ "${UPDATE_RESULT}" == success ]] || exit 1
          [[ "${REFRESH_SKIPPED}" != true ]] || exit 0
          [[ "${SHOULD_DEPLOY}" == true && "${DEPLOY_RESULT}" == success ]] || exit 1

  input-cache-diagnostics:
    if: inputs.diagnostics_only == true && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - name: Install locked read-only diagnostics runtime
        run: |
          python -m pip install uv==0.11.17
          uv sync --frozen --python "$(command -v python)"
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
      - name: Resolve the explicitly requested immutable input cache
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ inputs.reuse_input_cache_key }}
        run: |
          set -euo pipefail
          if [[ -z "${CACHE_KEY}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "${CACHE_KEY}" =~ ^factor-input-v1-([0-9]+)-([0-9]+)$ ]] || { echo "Invalid exact input cache key." >&2; exit 1; }
          run_id="${BASH_REMATCH[1]}"
          attempt="${BASH_REMATCH[2]}"
          cache_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=${CACHE_KEY}" --jq ".actions_caches[] | select(.key == \"${CACHE_KEY}\") | .id" | head -n 1)"
          [[ "${cache_id}" =~ ^[0-9]+$ ]] || { echo "Requested bounded input cache is unavailable." >&2; exit 1; }
          source_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .head_sha)"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "path=outputs/factor-daily/${run_id}-${attempt}" >> "$GITHUB_OUTPUT"
          echo "cache_id=${cache_id}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
      - name: Restore the exact input cache without collection
        id: restore-inputs
        if: steps.reuse.outputs.enabled == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          key: ${{ inputs.reuse_input_cache_key }}
          fail-on-cache-miss: true
          path: |
            ${{ steps.reuse.outputs.path }}/raw
            ${{ steps.reuse.outputs.path }}/market
      - name: Export the narrow historical input inspection
        env:
          REUSE_ROOT: ${{ steps.reuse.outputs.path }}
          FACTOR_REUSED_INPUT_CACHE_KEY: ${{ inputs.reuse_input_cache_key }}
          FACTOR_REUSED_INPUT_CACHE_ID: ${{ steps.reuse.outputs.cache_id }}
          FACTOR_REUSED_INPUT_SOURCE_SHA: ${{ steps.reuse.outputs.source_sha }}
          DIAGNOSTIC_SYMBOLS: ${{ inputs.diagnostic_symbols }}
          DIAGNOSTIC_START: ${{ inputs.diagnostic_start }}
          DIAGNOSTIC_END: ${{ inputs.diagnostic_end }}
        run: |
          set -euo pipefail
          [[ -n "${REUSE_ROOT}" ]] || { echo "Diagnostics require an explicit immutable input cache key." >&2; exit 1; }
          python -m factor_lab.integrated_automation export-input-diagnostics \
            --reuse-input-root "${REUSE_ROOT}" --output outputs/input-diagnostics \
            --symbols "${DIAGNOSTIC_SYMBOLS}" --start "${DIAGNOSTIC_START}" --end "${DIAGNOSTIC_END}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: factor-input-diagnostics-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: error
          path: outputs/input-diagnostics
