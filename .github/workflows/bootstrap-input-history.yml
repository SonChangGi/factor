name: Bootstrap Factor Input History

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  VECLIB_MAXIMUM_THREADS: 1
  NUMEXPR_NUM_THREADS: 1

jobs:
  preserve-validated-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - name: Install the locked snapshot reader
        run: |
          python -m pip install uv==0.11.17
          uv sync --frozen --python "$(command -v python)"
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
      - name: Decrypt and verify only the three validated source histories
        env:
          FACTOR_SEED_PASSPHRASE: ${{ secrets.FACTOR_HISTORY_BOOTSTRAP_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${FACTOR_SEED_PASSPHRASE}" ]]
          echo '708f0240e437c8f81158c3a4af27c473c445bbc81db4645caa58f018e6847fde  .github/bootstrap/factor-history-20261016.enc' | sha256sum --check
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in .github/bootstrap/factor-history-20261016.enc -out /tmp/factor-history.tar.gz \
            -pass env:FACTOR_SEED_PASSPHRASE
          echo '0d4083e23b1d165574c922d4e7dc8f5cffc96546aa708f89e79f81f6f14c97f7  /tmp/factor-history.tar.gz' | sha256sum --check
          python - <<'PY'
          import hashlib,json,os,tarfile
          from pathlib import Path
          from factor_lab.integrated_data import load_integrated_market
          target=Path('outputs/factor-daily')/(os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
          target.mkdir(parents=True)
          with tarfile.open('/tmp/factor-history.tar.gz') as archive:
              for member in archive.getmembers():
                  assert member.name.startswith('raw') and not Path(member.name).is_absolute()
                  assert '..' not in Path(member.name).parts and (member.isfile() or member.isdir())
              archive.extractall(target,filter='data')
          market=load_integrated_market(target/'raw')
          assert market.metadata['snapshotId']=='01c0f8dacaeef4ee7e6a3ae26183ec222254f44ce6e44eae1515ebc217a9bd87'
          assert list(market.prices.columns)==['CECO','IBOC','UUU']
          assert market.metadata['dataAsOf']=='2026-10-16'
          parent=json.loads((target/'raw/source-full-manifest.json').read_text())
          identity=parent.pop('snapshotId')
          assert hashlib.sha256(json.dumps(parent,sort_keys=True).encode()).hexdigest()==identity
          baseline=json.loads(Path('site/data/integrated-result.json').read_text())
          assert identity==baseline['data']['qualitySourceSnapshotId']==market.metadata['archiveSeed']['sourceFullSnapshotId']
          assert market.metadata['archiveSeed']['sourceFullFiles']==parent['files']
          receipt=dict(status='passed',sourceFullSnapshotId=identity,seedSnapshotId=market.metadata['snapshotId'],
                       columns=list(market.prices.columns),dataAsOf=market.metadata['dataAsOf'],
                       cacheKey='factor-input-v1-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
          (target/'bootstrap-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          (target/'market').mkdir()
          (target/'market/seed-only.json').write_text(json.dumps(dict(bootstrapOnly=True,seedSnapshotId=market.metadata['snapshotId'])))
          print(json.dumps(receipt))
          PY
      - name: Preserve the private input slice in the existing bounded cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          key: factor-input-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/factor-daily/${{ github.run_id }}-${{ github.run_attempt }}/raw
            outputs/factor-daily/${{ github.run_id }}-${{ github.run_attempt }}/market
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: factor-history-bootstrap-receipt
          retention-days: 3
          if-no-files-found: error
          path: outputs/factor-daily/*/bootstrap-receipt.json
