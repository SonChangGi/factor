name: Apply Reviewed Factor Universe

on:
  workflow_dispatch:
    inputs:
      expected_baseline_result_id:
        description: Exact reviewed last-good result for the universe transition
        required: true
        default: '5defc56758abd316bc55827b'
        type: string

concurrency:
  group: daily-factor-dashboard-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  VECLIB_MAXIMUM_THREADS: 1
  NUMEXPR_NUM_THREADS: 1

jobs:
  reviewed-universe:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - name: Install the locked calculation runtime
        run: |
          python -m pip install uv==0.11.17
          uv sync --frozen --extra live --extra dev --python "$(command -v python)"
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
      - name: Bind the reviewed source and accepted input cache
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASELINE: ${{ inputs.expected_baseline_result_id }}
        run: |
          set -euo pipefail
          python scripts/release_preflight.py --mode daily
          python -m pytest -q tests/test_integrated_universe_migration.py
          result_id="$(jq -r '.resultIdentity.resultId' site/data/integrated-result.json)"
          [[ "${result_id}" == "${EXPECTED_BASELINE}" ]] || { echo "The reviewed baseline has changed." >&2; exit 1; }
          key="$(jq -r '.data.inputCache.key' site/data/integrated-result.json)"
          [[ "${key}" =~ ^factor-input-v1-([0-9]+)-([0-9]+)$ ]] || exit 1
          root="outputs/factor-daily/${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
          cache_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=${key}" --jq ".actions_caches[] | select(.key == \"${key}\") | .id" | head -n 1)"
          [[ "${cache_id}" =~ ^[0-9]+$ ]] || { echo "The accepted frozen input cache is unavailable." >&2; exit 1; }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          echo "cache_id=${cache_id}" >> "$GITHUB_OUTPUT"
          echo "root=${root}" >> "$GITHUB_OUTPUT"
      - name: Restore accepted frozen inputs
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          key: ${{ steps.source.outputs.key }}
          fail-on-cache-miss: true
          path: |
            ${{ steps.source.outputs.root }}/raw
            ${{ steps.source.outputs.root }}/market
      - name: Recalculate the reviewed universe with all existing factors
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          ARCHIVE_ROOT: ${{ steps.source.outputs.root }}
        run: |
          python -m factor_lab.integrated_universe_migration \
            --workspace "outputs/universe-migration/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --baseline site --candidate outputs/universe-candidate \
            --archive-root "${ARCHIVE_ROOT}" --source-commit "${SOURCE_SHA}"
      - name: Confirm cache and promote the validated baseline
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          CACHE_KEY: ${{ steps.source.outputs.key }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "${DEFAULT_BRANCH}" --depth=1
          [[ "$(git rev-parse "origin/${DEFAULT_BRANCH}")" == "${SOURCE_SHA}" ]] || { echo "Source advanced during the migration." >&2; exit 1; }
          cache_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=${CACHE_KEY}" --jq ".actions_caches[] | select(.key == \"${CACHE_KEY}\") | .id" | head -n 1)"
          [[ "${cache_id}" =~ ^[0-9]+$ ]] || exit 1
          python -m factor_lab.integrated_automation confirm-input-cache \
            --workspace "outputs/universe-migration/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --cache-key "${CACHE_KEY}" --cache-id "${cache_id}"
          python -m factor_lab.integrated_automation promote \
            --workspace "outputs/universe-migration/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --baseline site --candidate outputs/universe-candidate
          python scripts/validate_integrated_publication.py site
          python -m factor_lab.publication_security site
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Validate the complete release before the result commit
        run: bash scripts/check_release.sh "${RUNNER_TEMP}/factor-reviewed-universe-public"
      - name: Publish the reviewed baseline and verify Pages
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site
          git commit -m "Apply reviewed major-exchange Factor universe through 2026-11-04"
          git push origin "HEAD:${DEFAULT_BRANCH}"
          source_sha="$(git rev-parse HEAD)"
          requested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run deploy-pages.yml --repo "${GITHUB_REPOSITORY}" --ref "${DEFAULT_BRANCH}" \
            -f expected_source_sha="${source_sha}" -f request_origin=manual
          deployment_run=""
          for attempt in {1..12}; do
            deployment_run="$(gh run list --workflow deploy-pages.yml --commit "${source_sha}" \
              --event workflow_dispatch --limit 10 --json databaseId,createdAt \
              --jq ".[] | select(.createdAt >= \"${requested_at}\") | .databaseId" | head -n 1)"
            [[ -n "${deployment_run}" ]] && break
            sleep 5
          done
          [[ -n "${deployment_run}" ]] || { echo "Exact-source Pages run was not found." >&2; exit 1; }
          timeout 2100s gh run watch "${deployment_run}" --interval 20 --exit-status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: factor-reviewed-universe-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            outputs/universe-migration/*/status.json
            outputs/universe-migration/*/progress.json
            outputs/universe-migration/*/market/manifest.json
            outputs/universe-migration/*/analysis/result.json
            outputs/universe-migration/*/analysis/progress.json
