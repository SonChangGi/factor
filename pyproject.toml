[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-factor-lab"
version = "0.1.0"
description = "Actual-market momentum factor and portfolio-weighting research lab."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "exchange-calendars>=4.13.2,<5",
  "numpy>=1.24",
  "pandas>=2.0",
  "rfc8785>=0.1.4,<0.2",
]

[project.optional-dependencies]
live = ["yfinance>=0.2.40", "finance-datareader>=0.9.202"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
momentum-factor-lab = "momentum_factor_lab.cli:main"

[tool.setuptools.packages.find]
include = ["momentum_factor_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["momentum_factor_lab", "tests"]

[tool.setuptools.package-data]
momentum_factor_lab = [
  "resources/*.csv",
  "resources/integrated_*.json",
  "web/*.html",
  "web/*.css",
  "web/*.js",
]
